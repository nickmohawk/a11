name: a11
on: [push]
jobs:
  test:
    name: test a11
    runs-on: ubuntu-latest

    steps:
      -uses: actions/checkout@v4
      -name: run script for 1
       run: python3 find_lowest_number.py test_data/test1_input.txt test_data/test1_output.txt

      -name: compare tests for 1
       run: diff test_data/test1_expected.txt test_data/test1_output.txt || exit 1

      -name: run script for 2
       run: python3 find_lowest_number.py test_data/test2_input.txt test_data/test2_output.txt
     
      -name: compare tests for 2
       run: diff test_data/test2_expected.txt test_data/test2_output.txt || exit 1


      -name: run script for 3
       run: python3 find_lowest_number.py test_data/test3_input.txt test_data/test3_output.txt

      -name: compare tests for 3
       run: diff test_data/test3_expected.txt test_data/test3_output.txt || exit 1
